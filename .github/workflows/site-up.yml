name: Site up (veille hebdomadaire)

# Veilleur sur l'hébergement : le règlement du concours exige que l'URL
# publique https://baptistefaisy.github.io/ghost-hours/ reste vivante et
# gratuite jusqu'au 29/01/2027. Ce workflow la vérifie chaque semaine et à la
# demande : HTTP 200, marque « Ghost Hours » dans le HTML, et un asset réel du
# bundle qui répond. Toute anomalie met le job en échec (workflow rouge dans
# l'onglet Actions + notification GitHub) avec la marche à suivre en message.
#
# Hebdomadaire et non quotidien : un site statique sur GitHub Pages ne casse
# pas tout seul ; le risque vient d'une mauvaise manipulation de gh-pages,
# visible au plus tard une semaine après. Lundi 07:00 UTC (08:00 à Paris) :
# début de semaine ouvrée pour qu'un humain puisse réagir le jour même, et
# heure creuse pour le cron GitHub (moins de retards de planification).
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Un seul run à la fois : la vérification est courte et sans état, empiler
# les runs n'apporterait rien.
concurrency:
  group: site-up
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-up:
    name: site-up
    # Runner self-hosted (comme deploy.yml et e2e.yml) : e2e.yml charge déjà
    # l'URL publique depuis ce runner après chaque déploiement, donc son accès
    # Internet vers baptistefaisy.github.io est prouvé ; on suit ce choix.
    # Aucun toolchain du dépôt nécessaire : shell + curl suffisent.
    runs-on: [self-hosted, linux, x64, ghost-hours-worker]
    timeout-minutes: 5
    env:
      SITE_URL: https://baptistefaisy.github.io/ghost-hours/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Vérifier le site public
        shell: bash
        run: bash .github/scripts/site-up.sh
