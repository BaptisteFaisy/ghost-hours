name: Deploy (GitHub Pages)

# Publishes the built app on the `gh-pages` branch, which is what GitHub Pages
# serves for this repository (build type "legacy", source `gh-pages` / root).
# The site therefore lives **in the repository**, on a branch of its own: no
# artifact store, no deployment API, and the judges' URL keeps working as long
# as the repository does (the contest requires it until 29 January 2027).
#
# Runs outside pull requests — a deploy is not a review check — and stays
# inside the five-minute budget like every other job.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "fixtures/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: publish-site
    runs-on: [self-hosted, linux, x64, ghost-hours-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean workspace
        shell: bash
        run: git clean -ffdx -e e2e/artifacts

      - name: Toolchain
        shell: bash
        run: source .github/ci/toolchain.sh

      - name: Install
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$HOME/tools/pnpm-store"

      - name: Build the site
        shell: bash
        run: |
          source .github/ci/toolchain.sh
          pnpm --filter @ghost-hours/web build
          test -f apps/web/dist/index.html

      # The `gh-pages` branch is generated content: it is replaced wholesale,
      # never merged into, and never protected (the ruleset covers `main` only).
      - name: Publish on gh-pages
        shell: bash
        env:
          GH_PAT: ${{ secrets.AUTOMERGE_PAT || github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gh-pages-publish
          git clone -q --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages-publish
          cd /tmp/gh-pages-publish
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'README.md' -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/apps/web/dist/." .
          touch .nojekyll
          # L'identité du propriétaire, pas celle du bot : le garde-fou
          # anti-faux-contributeur installé sur le runner refuse un commit signé
          # `github-actions[bot]`, et il a raison — un bot qui signe à la place
          # du propriétaire crée un contributeur fantôme. Le push passe par le
          # jeton du propriétaire, l'auteur doit être le propriétaire.
          git config user.name "BaptisteFaisy"
          git config user.email "119856854+BaptisteFaisy@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "site inchangé — rien à publier"
            exit 0
          fi
          git commit -q -m "site: build ${GITHUB_SHA::7}"
          git push -q origin gh-pages
          echo "publié sur gh-pages depuis ${GITHUB_SHA::7}"
